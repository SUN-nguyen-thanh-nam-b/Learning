; Copy this file to config.ini next to the executable and edit it.

[tiktok]
; Your TikTok handle. The @ is optional.
username = @your_handle
; Optional Euler Stream signing key. Leave blank to use the rate-limited
; free tier. Get one at https://www.eulerstream.com if you hit limits.
sign_api_key =

[printer]
; Path to the TiMini-Print CLI binary. Relative paths resolve next to this app.
exe_path = TiMini-Print-Command-Line-Windows-x86_64.exe
; BLE advertised name of the printer. Run with --scan to discover it.
bluetooth_name = PD01
; Optional print darkness passed straight to the CLI. Blank = printer default.
darkness =
; Any extra TiMini-Print CLI flags, appended verbatim.
extra_args =

[print]
; The printer's dot width -- 384 for the PD-01. This is NOT a size control:
; TiMini-Print rescales whatever it is given to exactly this width, so
; changing it only changes sharpness. Use avatar_scale to change the size.
width_px = 384

; How much of the paper width the avatar takes up, from 0.2 to 1.0.
; 1.0 fills the full 48 mm. Lower values pad with white and print smaller,
; which also makes each slip shorter and saves paper.
avatar_scale = 1.0
; Hard ceiling on prints per minute. Protects paper and the print head
; when a stream goes viral.
max_per_minute = 6
; Jobs beyond this are dropped rather than left to back up.
queue_max = 20
; Suppress a gift event that TikTok delivers more than once. This does NOT
; limit a person to one slip -- every separate gift prints.
dedupe = true
; Print the @handle underneath the avatar.
show_username = true
; Retries when a print fails. The printer sleeps after a few idle minutes and
; drops off BLE; gift events never repeat, so one failed try would lose the
; slip outright.
retries = 2

[app]
; Where rendered images are kept. Relative paths resolve next to this app.
save_dir = prints
